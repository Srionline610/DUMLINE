services:
  mysql:
    image: mysql:8.0
    container_name: dumline-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dumline_dev
      MYSQL_USER: dumline_user
      MYSQL_PASSWORD: DumlineTemp2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "dumline_user", "-pDumlineTemp2026!"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
